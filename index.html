<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>题目讲解助手</title>
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    crossorigin="anonymous"
    referrerpolicy="no-referrer"
  />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <style>
    :root {
      --bg-1: #f5e39b;
      --bg-2: #edd170;
      --panel: #f8f4df;
      --panel-2: #f2edd2;
      --line: #e4c05e;
      --ink: #2e2a25;
      --muted: #7a7367;
      --accent: #f29a3f;
      --accent-2: #ffcf73;
      --head: #2f3035;
      --paper: #ffffff;
    }

    * { 
      box-sizing: border-box; 
      /* Firefox 兼容性 */
      scrollbar-width: thin;
      scrollbar-color: var(--line) transparent;
    }

    /* 全局滚动条美化 */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background-color: rgba(228, 192, 94, 0.4); /* 使用 --line 的半透明色 */
      border-radius: 10px;
      transition: background-color 0.3s;
    }

    ::-webkit-scrollbar-thumb:hover {
      background-color: var(--line);
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Noto Serif SC", "Source Han Serif SC", "Microsoft YaHei", serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 20% -10%, #fff4c9 0 28%, transparent 29%),
        radial-gradient(circle at 90% 110%, #fbe9aa 0 24%, transparent 25%),
        linear-gradient(160deg, var(--bg-1), var(--bg-2));
      padding: 28px;
    }

    .app {
      max-width: 1460px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 450px 1fr 470px;
      gap: 22px;
      height: calc(100vh - 56px);
      animation: app-rise 0.8s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .panel {
      background: var(--panel);
      border: 2px solid var(--line);
      border-radius: 16px;
      box-shadow: 0 8px 18px rgba(91, 68, 18, 0.08);
      overflow: hidden;
      min-height: 0;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .panel:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(91, 68, 18, 0.12);
    }

    .left {
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 14px;
    }

    .left-top {
      display: grid;
      grid-template-columns: 88px 1fr;
      gap: 12px;
    }

    .esc {
      display: grid;
      place-items: center;
      background: #fffdf5;
      border: 2px solid var(--line);
      border-radius: 16px;
      color: #6f5e48;
      font-family: "Trebuchet MS", "Microsoft YaHei", sans-serif;
      font-size: 14px;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    .esc i {
      font-size: 22px;
      line-height: 1;
    }

    .esc:hover { transform: translateY(-2px); }

    .status {
      background: #fffdf5;
      border: 2px solid var(--line);
      border-radius: 16px;
      padding: 8px 14px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 8px;
    }

    .config-group {
      display: flex;
      gap: 8px;
    }

    .config-group select {
      flex: 1;
      padding: 4px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: #fff;
      font-size: 12px;
      color: var(--ink);
      cursor: pointer;
    }

    .status-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 0.4px;
      color: #f3b13f;
      font-family: "Trebuchet MS", "Microsoft YaHei", sans-serif;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .status-bar {
      width: 100%;
      height: 16px;
      background: #efe8d5;
      border-radius: 999px;
      overflow: hidden;
    }

    .status-fill {
      width: 32%;
      height: 100%;
      background: linear-gradient(90deg, #f0a96a, #f59d48);
      border-radius: 999px;
      transition: width .3s ease;
    }

    .status-sub {
      text-align: right;
      color: #e48f3f;
      font-family: "Trebuchet MS", "Microsoft YaHei", sans-serif;
      font-size: 14px;
    }

    .character {
      position: relative;
      background: url('assets/img/xy.png') center bottom / cover no-repeat;
      border: 2px solid var(--line);
      border-radius: 16px;
      overflow: hidden;
      min-height: 670px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding: 20px;
      isolation: isolate;
    }

    .character::before {
      content: none;
    }

    .character::after {
      content: "AI导师";
      position: absolute;
      top: 24px;
      right: 24px;
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(255, 245, 220, 0.87);
      border: 1px solid #f6d488;
      font-size: 14px;
      font-family: "Trebuchet MS", "Microsoft YaHei", sans-serif;
      color: #6c522d;
    }

    .character-bubble {
      position: absolute;
      left: 18px;
      right: 18px;
      bottom: 20px;
      background: rgba(255, 255, 255, 0.78);
      border: 1px solid #f2d385;
      border-radius: 14px;
      padding: 14px 16px;
      font-size: 16px;
      line-height: 1.5;
      color: #2a2a2a;
      backdrop-filter: blur(2px);
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    .chat {
      display: grid;
      grid-template-rows: 52px auto minmax(0, 1fr) 70px;
      gap: 12px;
      padding: 0;
      min-height: 0;
    }

    .head {
      background: linear-gradient(90deg, #3e3d41, #2e2e31);
      color: #f8ce66;
      font-family: "Trebuchet MS", "Microsoft YaHei", sans-serif;
      font-size: 22px;
      font-weight: 700;
      display: flex;
      align-items: center;
      padding: 0 18px;
      letter-spacing: .6px;
    }

    .question-card {
      background: #eedf9e;
      border: 2px solid #edd277;
      border-radius: 12px;
      margin: 0 16px;
      padding: 12px;
      display: grid;
      grid-template-columns: 1fr 100px;
      gap: 10px;
      min-height: 230px;
    }

    .preview-box {
      background: #fff;
      border-radius: 10px;
      border: 2px solid #ecd67d;
      display: grid;
      place-items: center;
      overflow: hidden;
      position: relative;
    }

    .preview-box img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: none;
      background: white;
    }

    .placeholder {
      text-align: center;
      color: #7f7152;
      padding: 20px;
      font-size: 16px;
      line-height: 1.6;
    }

    .q-actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: stretch;
      min-width: 0;
    }

    .q-actions button {
      border: 2px solid #efcc6f;
      background: #fff5d8;
      color: #b6812d;
      font-size: 18px;
      border-radius: 14px;
      height: 56px;
      line-height: 1;
      padding: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      font-family: "Trebuchet MS", "Microsoft YaHei", sans-serif;
      transition: all .2s ease;
    }

    .q-actions button:hover {
      transform: translateY(-1px);
      background: #ffefc4;
    }

    /* 引导点击的呼吸灯动画 */
    @keyframes pulse-gold {
      0% { box-shadow: 0 0 0 0 rgba(242, 154, 63, 0.4); }
      70% { box-shadow: 0 0 0 10px rgba(242, 154, 63, 0); }
      100% { box-shadow: 0 0 0 0 rgba(242, 154, 63, 0); }
    }

    .btn-pulse {
      animation: pulse-gold 2s infinite;
      border-color: var(--accent) !important;
    }

    .chat-feed {
      padding: 0 18px;
      overflow-y: auto;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      gap: 14px;
      min-height: 0;
    }

    .msg {
      display: grid;
      grid-template-columns: 44px 1fr;
      gap: 12px;
      align-items: start;
      animation: msg-in 0.4s cubic-bezier(0.18, 0.89, 0.32, 1.28) both;
    }

    @keyframes msg-in {
      from { opacity: 0; transform: translateX(-10px); }
      to { opacity: 1; transform: translateX(0); }
    }

    .msg-avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: linear-gradient(160deg, #d3973a, #ffdf80);
      border: 2px solid #e3b352;
      display: grid;
      place-items: center;
      font-size: 18px;
      flex-shrink: 0;
      overflow: hidden;
    }

    .msg-avatar.ai {
      background: url('assets/img/avatar.png') center / cover no-repeat;
      color: transparent;
      font-size: 0;
    }

    .msg-avatar.user {
      background: linear-gradient(160deg, #8ab1ff, #b3ccff);
      border-color: #7fa1ea;
      color: #1f3768;
      font-size: 16px;
      font-family: "Trebuchet MS", "Microsoft YaHei", sans-serif;
      font-weight: 700;
    }

    .msg-body {
      font-size: 16px;
      line-height: 1.65;
      color: #222;
      background: transparent;
      overflow-wrap: break-word;
    }

    .msg-body.error-box {
      background: #fff6ef;
      border: 2px solid #f2c186;
      border-radius: 12px;
      padding: 10px 14px;
      color: #8a531c;
      box-shadow: 0 3px 10px rgba(170, 112, 46, 0.12);
    }

    .msg-body p { margin: 0 0 0.8em; }
    .msg-body p:last-child { margin-bottom: 0; }
    .msg-body code {
      font-family: "Consolas", "Monaco", monospace;
      background: rgba(0,0,0,0.06);
      padding: 2px 4px;
      border-radius: 4px;
      font-size: 0.9em;
    }
    .msg-body pre {
      background: #1e1e1e;
      color: #d4d4d4;
      padding: 14px;
      border-radius: 10px;
      overflow-x: auto;
      margin: 1em 0;
      border: 1px solid #333;
    }
    .msg-body pre code {
      background: transparent;
      padding: 0;
      font-size: 14px;
    }
    .msg-body ul, .msg-body ol { padding-left: 20px; margin: 0.8em 0; }
    .msg-body blockquote { border-left: 4px solid var(--line); margin: 0; padding-left: 12px; color: var(--muted); }
    .msg-body table { border-collapse: collapse; width: 100%; margin: 1em 0; font-size: 14px; }
    .msg-body th, .msg-body td { border: 1px solid var(--line); padding: 8px; text-align: left; }
    .msg-body th { background: var(--panel-2); }
    .msg-body img { max-width: 100%; height: auto; border-radius: 8px; }

    /* 骨架屏样式 */
    .skeleton {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
      max-width: 450px;
      padding-top: 8px;
    }

    .skeleton-bar {
      height: 14px;
      background: linear-gradient(90deg, 
        rgba(228, 192, 94, 0.1) 25%, 
        rgba(228, 192, 94, 0.25) 50%, 
        rgba(228, 192, 94, 0.1) 75%
      );
      background-size: 200% 100%;
      animation: skeleton-shimmer 1.5s infinite linear;
      border-radius: 6px;
    }

    .skeleton-bar:nth-child(2) { width: 85%; }
    .skeleton-bar:nth-child(3) { width: 60%; }

    @keyframes skeleton-shimmer {
      0% { background-position: 100% 0; }
      100% { background-position: -100% 0; }
    }

    .ask {
      margin: 0 16px 14px;
      border-radius: 16px;
      border: 2px solid #eed88b;
      background: #fff;
      display: flex;
      overflow: hidden;
      min-height: 54px;
    }

    .ask input {
      border: none;
      outline: none;
      flex: 1;
      font-size: 16px;
      padding: 0 16px;
      color: #333;
      font-family: "Noto Serif SC", "Microsoft YaHei", serif;
    }

    .ask button {
      border: none;
      background: linear-gradient(120deg, #f8bf6a, #f19a43);
      color: #fff;
      font-size: 16px;
      font-family: "Trebuchet MS", "Microsoft YaHei", sans-serif;
      min-width: 78px;
      padding: 0 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
    }

    .draft {
      display: grid;
      grid-template-rows: 52px 1fr;
    }

    .draft-box {
      padding: 12px;
      background: #f5f5f5;
    }

    .draft-box textarea {
      width: 100%;
      height: 100%;
      border: none;
      resize: none;
      background: #f5f5f5;
      color: #2f2f2f;
      font-size: 16px;
      line-height: 1.6;
      outline: none;
      font-family: "LXGW WenKai", "KaiTi", serif;
    }

    .tip {
      font-size: 12px;
      color: #8a835f;
      margin: 2px 0 0;
      line-height: 1.3;
      text-align: center;
      white-space: normal;
      overflow-wrap: break-word;
      font-family: "Trebuchet MS", "Microsoft YaHei", sans-serif;
    }

    @keyframes app-rise {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 1280px) {
      .app {
        grid-template-columns: 1fr;
        height: auto;
      }

      .left {
        grid-template-rows: auto 560px;
      }

      .character { min-height: 560px; }

      .chat {
        min-height: 780px;
      }

      .draft {
        min-height: 500px;
      }
    }

    @media (max-width: 680px) {
      body { padding: 12px; }
      .status-head, .status-sub { font-size: 13px; }
      .head { font-size: 22px; }
      .placeholder, .msg-body, .ask input, .draft-box textarea { font-size: 14px; }
      .q-actions button, .ask button { font-size: 18px; }
      .character-bubble { font-size: 14px; }
      .chat { grid-template-rows: 44px auto 1fr 52px; }
      .question-card { min-height: 190px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="left">
      <div class="left-top">
        <button class="esc" id="escBtn"><i class="fa-solid fa-xmark"></i><br><small>ESC</small></button>
        <div class="status">
          <div class="status-head">◆ 模型配置</div>
          <div class="config-group">
            <select id="modelSelect">
              <option value="kimi-2.5">Kimi K2.5</option>
              <option value="gemini-3-flash">Gemini 3 Flash</option>
            </select>
            <select id="modeSelect">
              <option value="fast">快速</option>
              <option value="thinking">思考</option>
            </select>
          </div>
          <div class="status-bar" style="margin-top: 8px;"><div class="status-fill" id="ctxBar"></div></div>
          <div class="status-sub" id="ctxText">12.8k</div>
        </div>
      </div>

      <div class="character panel">
        <div class="character-bubble" id="characterBubble">
          把题目发给我，我会先给你结论，再一步一步解释为什么这样做。
        </div>
      </div>
    </aside>

    <main class="chat panel">
      <div class="head">◆ 正在讲解...</div>

      <section class="question-card">
        <div class="preview-box" id="previewBox">
          <img id="previewImg" alt="题目预览" />
          <div class="placeholder" id="placeholder">
            点击右侧【换题】上传题目图片<br />
            支持 jpg / png / webp
          </div>
        </div>

        <div class="q-actions">
          <button id="pickBtn"><i class="fa-regular fa-image"></i>换题</button>
          <button id="explainBtn"><i class="fa-solid fa-graduation-cap"></i>讲解</button>
          <button id="clearBtn"><i class="fa-solid fa-eraser"></i>清空</button>
          <div class="tip" id="timeTip"></div>
        </div>

        <input id="fileInput" type="file" accept="image/*" hidden />
      </section>

      <section class="chat-feed" id="chatFeed"></section>

      <form class="ask" id="askForm">
        <input id="askInput" placeholder="有什么不懂的，尽管问" />
        <button type="submit"><i class="fa-regular fa-paper-plane"></i>发送</button>
      </form>
    </main>

    <aside class="draft panel">
      <div class="head">◆ 他的草稿</div>
      <div class="draft-box">
        <textarea id="draft" placeholder="这里可以记录解题草稿、关键公式和中间结论..."></textarea>
      </div>
    </aside>
  </div>

  <script>
    const fileInput = document.getElementById('fileInput');
    const pickBtn = document.getElementById('pickBtn');
    const explainBtn = document.getElementById('explainBtn');
    const clearBtn = document.getElementById('clearBtn');
    const previewImg = document.getElementById('previewImg');
    const previewBox = document.getElementById('previewBox');
    const placeholder = document.getElementById('placeholder');
    const chatFeed = document.getElementById('chatFeed');
    const askForm = document.getElementById('askForm');
    const askInput = document.getElementById('askInput');
    const timeTip = document.getElementById('timeTip');
    const ctxBar = document.getElementById('ctxBar');
    const ctxText = document.getElementById('ctxText');
    const characterBubble = document.getElementById('characterBubble');
    const askSubmitBtn = askForm.querySelector('button[type="submit"]');
    const modelSelect = document.getElementById('modelSelect');
    const modeSelect = document.getElementById('modeSelect');

    marked.use({
      breaks: true,
      gfm: true
    });

    const MODEL_CONFIGS = {
      'gemini-3-flash': {
        url: 'https://api.xiayan.icu/gemini/v1/chat/completions?pwd=haitang000',
        model: 'gemini-3-flash'
      },
      'kimi-2.5': {
        url: 'https://api.xiayan.icu/kimi/v1/chat/completions?pwd=haitang000',
        model: 'kimi-k2.5'
      },
      'moonshot-v1-32k': {
        url: 'https://api.xiayan.icu/kimi/v1/chat/completions?pwd=haitang000',
        model: 'moonshot-v1-32k'
      }
    };

    const MODE_INSTRUCTIONS = {
      'fast': '【快速模式】请直接给出答案，保持简洁明了。',
      'thinking': '【深度思考模式】请一步步思考，详细展示推导过程，并分析关键细节。'
    };

    const DEFAULT_SYSTEM_PROMPT =
      '';
    let SYSTEM_PROMPT = DEFAULT_SYSTEM_PROMPT;

    let uploaded = null;
    let uploadedDataUrl = '';
    let previewObjectUrl = '';
    let isBusy = false;
    const conversation = [];
    const systemPromptReady = loadSystemPrompt();

    async function loadSystemPrompt() {
      try {
        const response = await fetch('prompt.md', { cache: 'no-store' });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const text = (await response.text()).trim();
        if (text) SYSTEM_PROMPT = text;
      } catch (error) {
        console.warn('加载 prompt.md 失败，已使用默认系统提示词。', error);
      }
    }

    function formatTime() {
      const now = new Date();
      const y = now.getFullYear();
      const m = String(now.getMonth() + 1).padStart(2, '0');
      const d = String(now.getDate()).padStart(2, '0');
      const hh = String(now.getHours()).padStart(2, '0');
      const mm = String(now.getMinutes()).padStart(2, '0');
      return `${y}/${m}/${d} ${hh}:${mm}`;
    }

    function sleep(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    function updateCharacterBubble(text) {
      characterBubble.style.opacity = '0';
      characterBubble.style.transform = 'translateY(5px)';
      setTimeout(() => {
        characterBubble.textContent = text;
        characterBubble.style.opacity = '1';
        characterBubble.style.transform = 'translateY(0)';
      }, 300);
    }

    function appendMsg(text, options = {}) {
      const { role = 'assistant', thinking = false, isError = false } = options;
      const article = document.createElement('article');
      article.className = 'msg';
      const avatar = document.createElement('div');
      const isUser = role === 'user';
      avatar.className = `msg-avatar ${isUser ? 'user' : 'ai'}`;
      avatar.textContent = isUser ? '你' : '';
      const body = document.createElement('div');
      body.className = 'msg-body';
      if (isError) body.classList.add('error-box');
      if (thinking) {
        body.innerHTML = `
          <div class="skeleton" id="current-thinking">
            <div class="skeleton-bar"></div>
            <div class="skeleton-bar"></div>
            <div class="skeleton-bar"></div>
          </div>`;
      } else {
        body.innerHTML = marked.parse(text);
        body.querySelectorAll('pre code').forEach(el => hljs.highlightElement(el));
      }
      article.appendChild(avatar);
      article.appendChild(body);
      chatFeed.appendChild(article);
      chatFeed.scrollTop = chatFeed.scrollHeight;
      return { article, body };
    }

    function increaseContext() {
      const current = parseFloat(ctxBar.style.width || '32');
      const next = Math.min(95, current + Math.random() * 8 + 2);
      ctxBar.style.width = `${next}%`;
      ctxText.textContent = `${(next * 0.4).toFixed(1)}k`;
    }

    function setBusy(state) {
      isBusy = state;
      pickBtn.disabled = state;
      explainBtn.disabled = state;
      askInput.disabled = state;
      askSubmitBtn.disabled = state;
    }

    function updateContextByUsage(usage) {
      if (!usage || typeof usage.total_tokens !== 'number') {
        increaseContext();
        return;
      }
      const total = usage.total_tokens;
      const pct = Math.max(32, Math.min(95, (total / 3000) * 100));
      ctxBar.style.width = `${pct}%`;
      ctxText.textContent = `${(total / 1000).toFixed(1)}k`;
    }

    function fileToDataUrl(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(String(reader.result));
        reader.onerror = () => reject(new Error('图片读取失败，请重试。'));
        reader.readAsDataURL(file);
      });
    }

    function parseApiError(data, fallback) {
      if (data && data.error && data.error.message) return data.error.message;
      return fallback || '接口调用失败，请稍后重试。';
    }

    async function* callModelStream(messages, configKey = modelSelect.value) {
      const config = MODEL_CONFIGS[configKey];
      const payload = {
        model: config.model,
        messages,
        stream: true
      };

      const response = await fetch(config.url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      if (!response.ok) {
        const errorData = await response.json().catch(() => ({}));
        throw new Error(parseApiError(errorData, `请求失败（HTTP ${response.status}）`));
      }

      const reader = response.body.getReader();
      const decoder = new TextDecoder("utf-8");
      let buffer = "";

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        
        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split("\n");
        buffer = lines.pop();

        for (const line of lines) {
          const trimmed = line.trim();
          if (!trimmed || !trimmed.startsWith("data: ")) continue;
          const dataStr = trimmed.slice(6);
          if (dataStr === "[DONE]") return;
          try {
            const data = JSON.parse(dataStr);
            const content = data.choices?.[0]?.delta?.content;
            if (content) yield { content, usage: data.usage };
          } catch (e) {}
        }
      }
    }

    async function initGreeting() {
      await systemPromptReady;
      const { body: msgBody } = appendMsg('', { thinking: true });
      
      try {
        const messages = [
          { role: 'system', content: SYSTEM_PROMPT },
          { role: 'user', content: '（华生进屋了，你抬头看见她，自然地打个招呼吧。记得保持你的性格特点，不要输出Markdown，不要解释设定。）' }
        ];
        
        let fullText = "";
        let displayedText = "";
        const stream = callModelStream(messages, 'moonshot-v1-32k');
        
        for await (const chunk of stream) {
          if (fullText === "") {
            msgBody.innerHTML = ""; 
            msgBody.classList.add('typing-active');
          }
          fullText += chunk.content;

          while (displayedText.length < fullText.length) {
            const charGap = fullText.length - displayedText.length;
            const step = charGap > 30 ? Math.ceil(charGap / 5) : 1; 
            displayedText = fullText.substring(0, displayedText.length + step);
            msgBody.innerHTML = marked.parse(displayedText);
            chatFeed.scrollTop = chatFeed.scrollHeight;
            if (charGap < 50) await new Promise(r => setTimeout(r, 15));
          }
        }
        msgBody.classList.remove('typing-active');
        msgBody.querySelectorAll('pre code').forEach(el => hljs.highlightElement(el));
        conversation.push({ role: 'assistant', content: fullText });
      } catch (e) {
        msgBody.classList.add('error-box');
        msgBody.innerHTML = "嘿，华生，你来啦！刚才信号好像有点不稳定……（初始化失败）";
      }
    }

    function clearPreview(resetConversation = true) {
      uploaded = null;
      uploadedDataUrl = '';
      if (previewObjectUrl) {
        URL.revokeObjectURL(previewObjectUrl);
        previewObjectUrl = '';
      }
      previewImg.style.display = 'none';
      previewImg.removeAttribute('src');
      placeholder.style.display = 'block';
      characterBubble.textContent = '把题目发给我，我会先给你结论，再一步一步解释为什么这样做。';
      if (resetConversation) conversation.length = 0;
    }

    pickBtn.addEventListener('click', () => fileInput.click());

    fileInput.addEventListener('change', async (e) => {
      const file = e.target.files?.[0];
      if (!file) return;

      if (!file.type.startsWith('image/')) {
        appendMsg('只支持图片文件，请重新选择。', { isError: true });
        return;
      }
      if (file.size > 8 * 1024 * 1024) {
        appendMsg('图片请控制在 8MB 以内，避免上传失败。', { isError: true });
        return;
      }

      uploaded = file;
      conversation.length = 0;

      if (previewObjectUrl) URL.revokeObjectURL(previewObjectUrl);
      previewObjectUrl = URL.createObjectURL(file);
      previewImg.src = previewObjectUrl;
      previewImg.style.display = 'block';
      placeholder.style.display = 'none';

      try {
        uploadedDataUrl = await fileToDataUrl(file);
      } catch (error) {
        clearPreview(false);
        appendMsg(error.message, { isError: true });
        return;
      }

      timeTip.textContent = formatTime();
      updateCharacterBubble(`已收到题目《${file.name}》，点“讲解”开始。`);
      appendMsg(`收到你的题目：${file.name}。你可以点“讲解”，我会给你完整思路。`);
      explainBtn.classList.add('btn-pulse');
      increaseContext();
    });

    explainBtn.addEventListener('click', async () => {
      if (!uploaded) {
        appendMsg('请先上传题目图片，我才能开始讲解。', { isError: true });
        return;
      }
      if (!uploadedDataUrl) {
        appendMsg('图片尚未就绪，请重新上传后再试。', { isError: true });
        return;
      }
      if (isBusy) return;

      explainBtn.classList.remove('btn-pulse');
      const { article: thinkingMsg, body: msgBody } = appendMsg('正在思考...', { thinking: true });
      setBusy(true);
      try {
        await systemPromptReady;
        const modePrompt = MODE_INSTRUCTIONS[modeSelect.value];
        const userPrompt = 
          `${modePrompt}\n请讲解这道题。先给最终结论，再给完整步骤推导（分点编号），最后给易错点和检查方法。`;
        const messages = [
          { role: 'system', content: SYSTEM_PROMPT },
          ...conversation,
          {
            role: 'user',
            content: [
              { type: 'text', text: userPrompt },
              { type: 'image_url', image_url: { url: uploadedDataUrl } }
            ]
          }
        ];

        let fullText = "";
        let displayedText = "";
        let lastUsage = null;
        const stream = callModelStream(messages);
        
        for await (const chunk of stream) {
          if (fullText === "") {
            msgBody.innerHTML = ""; // 收到第一个块时清除骨架屏
            msgBody.classList.add('typing-active');
          }
          fullText += chunk.content;

          // 逐字平滑追赶逻辑
          while (displayedText.length < fullText.length) {
            const charGap = fullText.length - displayedText.length;
            const step = charGap > 30 ? Math.ceil(charGap / 5) : 1; 
            displayedText = fullText.substring(0, displayedText.length + step);
            
            msgBody.innerHTML = marked.parse(displayedText);
            chatFeed.scrollTop = chatFeed.scrollHeight;
            if (charGap < 50) await new Promise(r => setTimeout(r, 15));
          }
          if (chunk.usage) lastUsage = chunk.usage;
        }

        msgBody.classList.remove('typing-active');
        msgBody.querySelectorAll('pre code').forEach(el => hljs.highlightElement(el));
        conversation.push({ role: 'user', content: '我上传了一道题目图片，请你完整讲解。' });
        conversation.push({ role: 'assistant', content: fullText });
        updateCharacterBubble('讲解完成。你可以继续追问“为什么这么做”。');
        if (lastUsage) updateContextByUsage(lastUsage);
      } catch (error) {
        thinkingMsg.remove();
        appendMsg(`讲解失败：${error.message}`, { isError: true });
      } finally {
        setBusy(false);
      }
    });

    clearBtn.addEventListener('click', () => {
      clearPreview();
      explainBtn.classList.remove('btn-pulse');
      fileInput.value = '';
      appendMsg('题目已清空。重新上传后我会继续讲解。');
    });

    askForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const q = askInput.value.trim();
      if (!q) return;
      if (isBusy) return;

      appendMsg(q, { role: 'user' });
      askInput.value = '';
      setBusy(true);

      let thinkingMsg = null;
      let msgBody = null;

      await sleep(500);

      ({ article: thinkingMsg, body: msgBody } = appendMsg('正在思考...', { thinking: true }));
      try {
        await systemPromptReady;
        const modePrompt = MODE_INSTRUCTIONS[modeSelect.value];
        const fullQuery = `${modePrompt}\n${q}`;
        const messages = [
          { role: 'system', content: SYSTEM_PROMPT },
          ...conversation,
          { role: 'user', content: fullQuery }
        ];

        let fullText = "";
        let displayedText = "";
        let lastUsage = null;
        const stream = callModelStream(messages);

        for await (const chunk of stream) {
          if (fullText === "") {
            msgBody.innerHTML = "";
            msgBody.classList.add('typing-active');
          }
          fullText += chunk.content;

          while (displayedText.length < fullText.length) {
            const charGap = fullText.length - displayedText.length;
            const step = charGap > 30 ? Math.ceil(charGap / 5) : 1;
            displayedText = fullText.substring(0, displayedText.length + step);

            msgBody.innerHTML = marked.parse(displayedText);
            chatFeed.scrollTop = chatFeed.scrollHeight;
            if (charGap < 50) await new Promise(r => setTimeout(r, 15));
          }
          if (chunk.usage) lastUsage = chunk.usage;
        }

        msgBody.classList.remove('typing-active');
        msgBody.querySelectorAll('pre code').forEach(el => hljs.highlightElement(el));
        conversation.push({ role: 'user', content: q });
        conversation.push({ role: 'assistant', content: fullText });
        if (lastUsage) updateContextByUsage(lastUsage);
      } catch (error) {
        if (thinkingMsg) thinkingMsg.remove();
        appendMsg(`追问失败：${error.message}`, { isError: true });
      } finally {
        setBusy(false);
      }
    });

    document.getElementById('escBtn').addEventListener('click', () => {
      appendMsg('已退出沉浸模式。');
    });

    timeTip.textContent = formatTime();
    initGreeting();
  </script>
</body>
</html>
