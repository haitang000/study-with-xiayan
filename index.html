<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#111827" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>Study With 夏彦</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="icon" href="assets/img/avatar.png" />
  <link rel="apple-touch-icon" href="assets/img/avatar.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
  <script>
    window.__STUDY_ENV__ = window.__STUDY_ENV__ || {};
  </script>
  <script src="js/env.local.js" onerror="window.__STUDY_ENV__=window.__STUDY_ENV__||{}"></script>
  <link rel="modulepreload" href="js/config.js" />
  <link rel="modulepreload" href="js/storage.js" />
  <link rel="modulepreload" href="js/api.js" />
</head>

<body>
  <div class="app">
    <aside class="left">
      <div class="left-top">
        <button class="esc" id="moreBtn" type="button"><i class="fa-solid fa-bars"></i><br><small>更多</small></button>
        <div class="status">
          <div class="status-head">◆ 模式选择</div>
          <div class="config-group">
            <div class="mode-switch" id="modeSwitch" role="tablist" aria-label="模式选择">
              <button type="button" class="mode-btn active" data-mode="fast" data-tip="快速模式：更简洁、更快返回结果">
                <i class="fa-solid fa-bolt" aria-hidden="true"></i>
                <span>快速</span>
              </button>
              <button type="button" class="mode-btn" data-mode="thinking" data-tip="思考模式：更详细展示推导与分析">
                <i class="fa-solid fa-brain" aria-hidden="true"></i>
                <span>思考</span>
              </button>
            </div>
          </div>
        </div>
      </div>

      <div class="character panel">
        <div class="character-bubble" id="characterBubble">
          把题目发给我，我会先给你结论，再一步一步解释为什么这样做。
        </div>
      </div>
    </aside>

    <main class="chat panel">
      <div class="head">◆ 正在讲解...</div>

      <section class="question-card" id="questionCard">
        <div class="preview-box" id="previewBox">
          <img id="previewImg" alt="题目预览" />
          <div class="placeholder" id="placeholder">
            点击右侧【换题】上传题目图片<br />
            支持 jpg / png / webp
          </div>
        </div>

        <div class="q-actions">
          <button id="pickBtn"><i class="fa-regular fa-image"></i>换题</button>
          <button id="explainBtn"><i class="fa-solid fa-graduation-cap"></i>讲解</button>
          <button id="clearBtn"><i class="fa-solid fa-eraser"></i>清空</button>
          <div class="tip" id="timeTip"></div>
        </div>

        <!-- 移动端相机直拍按钮 -->
        <button type="button" class="camera-btn" id="cameraBtn" aria-label="拍照上传">
          <i class="fa-solid fa-camera"></i>
        </button>

        <input id="fileInput" type="file" accept="image/*" hidden />
        <input id="cameraInput" type="file" accept="image/*" capture="environment" hidden />
      </section>

      <div class="image-lightbox" id="imageLightbox" aria-hidden="true">
        <button type="button" class="image-lightbox-close" id="imageLightboxClose" aria-label="关闭预览">
          <i class="fa-solid fa-xmark"></i>
        </button>
        <img id="lightboxImg" alt="题目大图预览" />
      </div>

      <section class="chat-feed" id="chatFeed"></section>

      <!-- 滚动到底部按钮 -->
      <button type="button" class="scroll-bottom-btn" id="scrollBottomBtn" aria-label="滚动到底部">
        <i class="fa-solid fa-chevron-down"></i>
      </button>

      <form class="ask" id="askForm" autocomplete="off">
        <textarea id="askInput" name="ask_no_history" placeholder="有什么不懂的，尽管问" autocomplete="off" autocapitalize="off"
          autocorrect="off" spellcheck="false" rows="1"></textarea>
        <button type="submit"><i class="fa-regular fa-paper-plane"></i><span class="send-label">发送</span></button>
      </form>

      <section class="context-meter" aria-label="上下文计算">
        <div class="context-ring" id="ctxRing" style="--p:0">
          <span id="ctxPct">0%</span>
        </div>
        <div class="context-meter-meta">
          <div class="context-meter-title">上下文</div>
          <div id="ctxText">0 / 32k tokens</div>
        </div>
      </section>
    </main>

    <aside class="draft panel">
      <div class="head draft-head">
        <span>◆ 笔记</span>
        <button type="button" id="exportMdBtn" class="draft-export-btn">
          <i class="fa-solid fa-file-arrow-down"></i> 导出 MD
        </button>
      </div>
      <div class="draft-box">
        <div id="draftPreview" class="draft-markdown msg-body" title="点击可编辑 Markdown"></div>
        <textarea id="draft" placeholder="夏彦回答后会自动生成笔记..."></textarea>
      </div>
    </aside>
  </div>

  <!-- 移动端底部标签栏 -->
  <nav class="mobile-tabbar" id="mobileTabbar" aria-label="主导航">
    <button type="button" class="tab-btn active" data-tab="chat" aria-label="对话">
      <i class="fa-solid fa-comments"></i>
      <span>对话</span>
    </button>
    <button type="button" class="tab-btn" data-tab="question" aria-label="题目">
      <i class="fa-solid fa-image"></i>
      <span>题目</span>
    </button>
    <button type="button" class="tab-btn" data-tab="draft" aria-label="笔记">
      <i class="fa-solid fa-book"></i>
      <span>笔记</span>
    </button>
    <button type="button" class="tab-btn" data-tab="settings" aria-label="更多" id="tabMoreBtn">
      <i class="fa-solid fa-bars"></i>
      <span>更多</span>
    </button>
  </nav>

  <div class="sidebar-overlay" id="sidebarOverlay" aria-hidden="true">
    <aside class="sidebar-drawer" id="sidebarDrawer" aria-label="更多功能">
      <div class="sidebar-head">
        <span>更多</span>
        <button type="button" class="sidebar-close" id="sidebarCloseBtn" aria-label="关闭侧边栏">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      <button type="button" class="sidebar-action" id="openSettingsBtn">
        <i class="fa-solid fa-gear"></i>
        <span>设置</span>
      </button>
      <section class="history-section">
        <div class="history-head">
          <span>对话记录</span>
          <button type="button" id="clearHistoryBtn">新对话</button>
        </div>
        <input type="text" id="historySearchInput" class="history-search" placeholder="搜索对话记录… (Ctrl+K)" autocomplete="off" aria-label="搜索对话记录" />
        <div class="history-list" id="historyList"></div>
      </section>
    </aside>
  </div>
  <div class="settings-modal" id="complianceModal" aria-hidden="true" style="z-index: 10005;">
    <div class="settings-card" style="max-width: 340px; text-align: center; padding: 24px 20px;">
      <div class="settings-title" style="font-size: 20px; color: #b4593f; margin-bottom: 20px;"><i
          class="fa-solid fa-shield-halved"></i> 请同意用户条款</div>
      <div style="font-size: 15px; color: #5d4930; line-height: 1.6; text-align: left; margin-bottom: 24px;">
        <a href="term.html" target="_blank"
          style="color: #b4593f; font-weight: bold; text-decoration: underline;">前往查看用户条款</a>
        <br><br>
        <span style="color: #8a7f64; font-size: 13px;">当您继续使用时则视为您同意该条款</span>
        <br>
        <span style="color: #8a7f64; font-size: 13px;">本项目基于人工智能技术实现，AI也会犯错</span>
        <br>
        <span style="color: #8a7f64; font-size: 13px;">在使用时请多次检查确保结果无误</span>
      </div>
      <div class="settings-actions" style="margin-top: 0; justify-content: center;">
        <button type="button" id="agreeComplianceBtn"
          style="width: 100%; height: 44px; font-size: 15px;">我已知晓并同意</button>
      </div>
    </div>
  </div>

  <div class="settings-modal" id="settingsModal" aria-hidden="true">
    <div class="settings-card">
      <div class="settings-title">聊天设置</div>
      <div class="settings-fields">
        <div class="settings-field">
          <label for="providerSelect">模型供应商</label>
          <select id="providerSelect">
            <option value="native_gemini">内置默认 (Gemini)</option>
            <option value="native_claude">内置代理 (Claude)(限量)</option>
            <option value="proxy">内置代理 (Kimi)</option>
            <option value="native_deepseek">内置代理 (DeepSeek)</option>
            <option value="moonshot">Moonshot 官方</option>
            <option value="openai">OpenAI 官方</option>
            <option value="deepseek">DeepSeek 官方</option>
            <option value="siliconflow">SiliconFlow</option>
            <option value="custom">自定义 OpenAI 兼容</option>
          </select>
        </div>
        <div class="settings-field">
          <label for="baseUrlInput">API Base URL</label>
          <input id="baseUrlInput" type="text" placeholder="https://api.example.com/v1/chat/completions"
            autocomplete="off" />
        </div>
      </div>
      <input id="apiKeyInput" type="password" placeholder="API Key" autocomplete="off" />
      <div class="settings-fields">
        <div class="settings-field">
          <label for="fastModelSelect">快速模式模型</label>
          <input id="fastModelInput" type="text" placeholder="例如：gpt-4o-mini / deepseek-chat" autocomplete="on" />
        </div>
        <div class="settings-field">
          <label for="thinkingModelSelect">思考模式模型</label>
          <input id="thinkingModelInput" type="text" placeholder="例如：gpt-4.1 / deepseek-reasoner" autocomplete="on" />
        </div>
      </div>
      <div class="settings-fields">
        <div class="settings-field">
          <label for="nicknameInput">你的昵称</label>
          <input id="nicknameInput" type="text" placeholder="例如：小夏" autocomplete="on" />
        </div>
        <div class="settings-field avatar-field">
          <label for="uploadAvatarBtn">头像</label>
          <div class="avatar-setting-row">
            <img id="settingsAvatarPreview" class="settings-avatar-preview" src="assets/img/user_avatar.png" alt="当前头像" />
            <div class="avatar-setting-meta">
              <div class="avatar-setting-tip">设置你当前的头像</div>
              <div class="avatar-upload-row">
                <button type="button" id="uploadAvatarBtn" class="avatar-action-btn"><i class="fa-solid fa-upload"></i> 上传图片</button>
                <button type="button" id="clearAvatarBtn" class="avatar-action-btn ghost" hidden>清空头像</button>
              </div>
            </div>
          </div>
          <input id="avatarUrlInput" type="text" autocomplete="off" hidden />
          <input id="avatarFileInput" type="file" accept="image/*" hidden />
        </div>
      </div>
      <div class="settings-actions">
        <button type="button" id="saveApiKeyBtn">保存</button>
        <button type="button" id="resetDefaultModelsBtn" class="ghost">默认</button>
        <button type="button" id="clearApiKeyBtn" class="ghost">清除</button>
        <button type="button" id="closeSettingsBtn" class="ghost">关闭</button>
      </div>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>

</html>
